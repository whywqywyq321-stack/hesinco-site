<body data-page="gallery">
  <header id="topbar"></header>

  <section class="hero">
    <div class="wrap">
      <div class="eyebrow" style="color:var(--accent)" data-i18n="nav.gallery">GALLERY</div>
      <h1 data-i18n="gallery.title">LINGYANG Product Gallery</h1>
      <p class="lead" data-i18n="gallery.subtitle">Official model photographs from the LINGYANG catalog — truck cranes, motorhomes, pickups & specialty vehicles.</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="gallery-grid">
        <figure class="g-item"><img src="assets/images/gallery/catalog_01.jpg" alt="LINGYANG catalog page 1" loading="lazy" onclick="openLightbox(this.src)"><figcaption data-i18n="gallery.view">Tap a photo to enlarge</figcaption></figure>

        <figure class="g-item"><img src="assets/images/gallery/catalog_05.jpg" alt="LINGYANG catalog page 5" loading="lazy" onclick="openLightbox(this.src)"><figcaption data-i18n="gallery.view">Tap a photo to enlarge</figcaption></figure>

      </div>
      <div class="gallery-cta">
        <a href="assets/files/lingyang_catalog.pdf" class="btn btn-blue" download data-i18n="gallery.download">Download Full Catalog (PDF)</a>
      </div>
    </div>
  </section>
